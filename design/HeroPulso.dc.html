<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&display=swap">
  <style>
    body { margin: 0; font-family: 'Geist', system-ui, -apple-system, sans-serif; background: #ffffff; }
    a { color: #6d28d9; } a:hover { color: #7c3aed; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 560px; padding: 40px; background: #ffffff; color: #0a0a0a;">

  <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #6d28d9; margin-bottom: 26px;">
    Alternativa 2 · Pulso mínimo
  </div>

  <!-- Anillos concéntricos: una llamada que entra, nada más -->
  <div style="position: relative; display: flex; align-items: center; justify-content: center; height: 300px;">
    <div style="position: absolute; width: 300px; height: 300px; border-radius: 999px; border: 1px solid #f3eeff;"></div>
    <div style="position: absolute; width: 228px; height: 228px; border-radius: 999px; border: 1px solid #f3eeff;"></div>
    <div style="position: absolute; width: 156px; height: 156px; border-radius: 999px; border: 1px solid #ddd6fe;"></div>
    <div style="position: absolute; width: 92px; height: 92px; border-radius: 999px; background: #f3eeff;"></div>
    <div style="position: relative; display: flex; width: 62px; height: 62px; align-items: center; justify-content: center; border-radius: 999px; background: #0a0a0a;">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
    </div>

    <div style="position: absolute; right: 0; top: 44px; display: flex; align-items: center; gap: 9px; padding: 9px 15px; border-radius: 999px; background: #ffffff; border: 1px solid #e5e5e5;">
      <span style="width: 7px; height: 7px; border-radius: 999px; background: #2c7334;"></span>
      <span style="font-size: 13px; font-weight: 600;">Atendida en 2 tonos</span>
    </div>

    <div style="position: absolute; left: 8px; bottom: 40px; display: flex; align-items: center; gap: 9px; padding: 9px 15px; border-radius: 999px; background: #ffffff; border: 1px solid #e5e5e5;">
      <span style="width: 7px; height: 7px; border-radius: 999px; background: #8b5cf6;"></span>
      <span style="font-size: 13px; font-weight: 600;">jueves · 17:30</span>
    </div>
  </div>

  <p style="margin: 26px 0 0; font-size: 14px; line-height: 1.7; color: #52525b;">
    En movimiento: los anillos salen del centro cada pocos segundos, como un tono de llamada. Es lo más abstracto y lo más barato de mantener, pero también lo que menos cuenta por sí solo.
  </p>
</div>
</x-dc>
</body>
</html>
