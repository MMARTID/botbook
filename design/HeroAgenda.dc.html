<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&display=swap">
  <style>
    body { margin: 0; font-family: 'Geist', system-ui, -apple-system, sans-serif; background: #ffffff; }
    a { color: #6d28d9; } a:hover { color: #7c3aed; }
    * { box-sizing: border-box; }
    .slot { height: 26px; border-radius: 7px; }
  </style>
</helmet>

<div style="width: 560px; padding: 40px; background: #ffffff; color: #0a0a0a;">

  <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #6d28d9; margin-bottom: 26px;">
    Alternativa 1 · La agenda se llena sola
  </div>

  <!-- Rejilla semanal: huecos vacíos que se van ocupando -->
  <div style="display: grid; grid-template-columns: 40px repeat(5, minmax(0, 1fr)); gap: 8px; align-items: center;">
    <div></div>
    <div style="font-size: 12px; font-weight: 700; color: #52525b; text-align: center;">L</div>
    <div style="font-size: 12px; font-weight: 700; color: #52525b; text-align: center;">M</div>
    <div style="font-size: 12px; font-weight: 700; color: #52525b; text-align: center;">X</div>
    <div style="font-size: 12px; font-weight: 700; color: #52525b; text-align: center;">J</div>
    <div style="font-size: 12px; font-weight: 700; color: #52525b; text-align: center;">V</div>

    <div style="font-size: 11px; color: #a1a1aa; text-align: right;">10:00</div>
    <div class="slot" style="background: #8b5cf6;"></div>
    <div class="slot" style="background: #fafafa; border: 1px solid #e5e5e5;"></div>
    <div class="slot" style="background: #ddd6fe;"></div>
    <div class="slot" style="background: #fafafa; border: 1px solid #e5e5e5;"></div>
    <div class="slot" style="background: #8b5cf6;"></div>

    <div style="font-size: 11px; color: #a1a1aa; text-align: right;">12:00</div>
    <div class="slot" style="background: #fafafa; border: 1px solid #e5e5e5;"></div>
    <div class="slot" style="background: #a78bfa;"></div>
    <div class="slot" style="background: #8b5cf6;"></div>
    <div class="slot" style="background: #ddd6fe;"></div>
    <div class="slot" style="background: #fafafa; border: 1px solid #e5e5e5;"></div>

    <div style="font-size: 11px; color: #a1a1aa; text-align: right;">17:30</div>
    <div class="slot" style="background: #ddd6fe;"></div>
    <div class="slot" style="background: #8b5cf6;"></div>
    <div class="slot" style="background: #fafafa; border: 1px solid #e5e5e5;"></div>
    <div class="slot" style="background: #0a0a0a; box-shadow: 0 0 0 3px #ddd6fe;"></div>
    <div class="slot" style="background: #a78bfa;"></div>

    <div style="font-size: 11px; color: #a1a1aa; text-align: right;">19:00</div>
    <div class="slot" style="background: #fafafa; border: 1px solid #e5e5e5;"></div>
    <div class="slot" style="background: #ddd6fe;"></div>
    <div class="slot" style="background: #a78bfa;"></div>
    <div class="slot" style="background: #8b5cf6;"></div>
    <div class="slot" style="background: #fafafa; border: 1px solid #e5e5e5;"></div>
  </div>

  <div style="display: flex; align-items: center; gap: 10px; margin-top: 28px;">
    <span style="width: 12px; height: 12px; border-radius: 4px; background: #0a0a0a; box-shadow: 0 0 0 3px #ddd6fe;"></span>
    <span style="font-size: 14px; font-weight: 600;">La cita que acaba de entrar por teléfono</span>
  </div>

  <p style="margin: 22px 0 0; font-size: 14px; line-height: 1.7; color: #52525b;">
    En movimiento: los huecos vacíos se van ocupando de uno en uno, y el último cae con un pulso. Cuenta el beneficio sin que haya que leer un diálogo.
  </p>
</div>
</x-dc>
</body>
</html>
