# Ejecución puntual y segura tras un cambio transversal del prompt gestionado.
# Usa el mismo Cloud SQL Auth Proxy que las migraciones de producción y lee los
# secretos dentro de Cloud Build: ningún secreto se descarga al equipo local.
steps:
  # Dependencias en un paso SIN secretos: los scripts de instalación de los
  # paquetes de terceros no deben ver DATABASE_URL ni RETELL_API_KEY.
  - name: "node:22-alpine"
    dir: "backend"
    entrypoint: "npm"
    args: ["ci"]

  - name: "node:22-alpine"
    dir: "backend"
    # El job vive fuera de Cloud Run y no hereda sus variables. Esta URL
    # pública es necesaria para que syncCalendarToolsToAgents pueda registrar
    # las URLs de las custom tools en Retell.
    env:
      - "BASE_URL=https://alhabla-api-k3jbjapgxa-ew.a.run.app"
    entrypoint: "sh"
    args:
      - "-c"
      - |
        set -e
        apk add --no-cache curl
        curl -sSL -o /usr/local/bin/cloud-sql-proxy \
          https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.25.4/cloud-sql-proxy.linux.amd64
        # Mismo binario y mismo hash que backend/cloudbuild.yaml.
        echo "b780c0d2c445ffd5d2fdba0925f2722c19fcd0d2c27c538e85713732698561f2  /usr/local/bin/cloud-sql-proxy" | sha256sum -c -
        chmod +x /usr/local/bin/cloud-sql-proxy
        mkdir -p /cloudsql
        /usr/local/bin/cloud-sql-proxy --unix-socket=/cloudsql \
          project-84381467-a606-4b71-a6e:europe-west1:alhabla-db &
        SOCKET=/cloudsql/project-84381467-a606-4b71-a6e:europe-west1:alhabla-db/.s.PGSQL.5432
        for i in $$(seq 1 15); do
          [ -S "$$SOCKET" ] && break
          sleep 1
        done
        [ -S "$$SOCKET" ]
        if [ "${_INCLUDE_MANUAL}" = "true" ]; then
          npx tsx scripts/syncManagedAgentPrompts.ts --include-manual
        else
          npx tsx scripts/syncManagedAgentPrompts.ts
        fi
    secretEnv: ["DATABASE_URL", "RETELL_API_KEY"]

availableSecrets:
  secretManager:
    - versionName: projects/project-84381467-a606-4b71-a6e/secrets/DATABASE_URL/versions/latest
      env: "DATABASE_URL"
    - versionName: projects/project-84381467-a606-4b71-a6e/secrets/RETELL_API_KEY/versions/latest
      env: "RETELL_API_KEY"

substitutions:
  # En una actualización de infraestructura de voz se activa explícitamente
  # para no dejar desprotegidos agentes con prompts editados a mano.
  _INCLUDE_MANUAL: "false"
