name: CI

# Gate de calidad: corre en cada PR y en cada push a main, para backend y
# frontend por separado. No despliega nada — eso lo hace deploy-backend.yml
# (solo backend; el frontend se despliega solo vía la integración Git de
# Vercel). Ver Second-Brain "Runbook de despliegue a producción" y
# "Producción e infraestructura" para el resto del pipeline.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend — typecheck, lint, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test

  integration:
    name: Backend — tests de integración
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Estos tests corren contra Postgres y Redis DE VERDAD (no mocks): es la
    # única capa donde se comprueban el esquema real, las transacciones y la
    # caché de voz. Existían desde hacía tiempo pero no los ejecutaba nadie
    # salvo a mano, así que un fallo de esquema solo aparecía en producción.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alhabla_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # En local estas variables salen de backend/.env.test, que está en
      # .gitignore. `tests/integration/setup.ts` carga ese fichero con dotenv
      # SIN override, así que lo que se ponga aquí manda y en CI da igual que
      # el fichero no exista. El puerto es 5432 y no 5433: el 5433 de local
      # solo evita el choque con el Postgres de Homebrew.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/alhabla_test
      REDIS_URL: redis://localhost:6379/1
      # Valores de relleno, no secretos: estos tests no llaman a ningún
      # servicio externo.
      JWT_SECRET: ci-tests-de-integracion-sin-valor-real
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # El esquema tiene que existir antes de que los tests limpien tablas.
      # `migrate deploy` (no `dev`) para aplicar exactamente las migraciones
      # versionadas, que es lo que corre en producción.
      - run: npx prisma migrate deploy

      - run: npm run test:integration

  diff:
    name: Cambios — migraciones y orden de despliegue
    # Solo en PR: son avisos para quien revisa. En un push a main ya es tarde.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # cloudbuild.yaml aplica las migraciones ANTES de cambiar el tráfico, así
      # que durante el despliegue conviven el esquema nuevo y la revisión
      # antigua. Quitar o renombrar una columna en el mismo deploy que el
      # código que deja de usarla rompe esa revisión mientras dura el cambio:
      # hay que hacerlo en DOS deploys (dejar de usarla → borrarla). Esa regla
      # vivía solo en la cabeza de quien la aprendió con los calendarios.
      - name: Migraciones destructivas sin confirmar
        env:
          ETIQUETAS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          BASE="origin/${{ github.base_ref }}"
          NUEVAS=$(git diff --name-only --diff-filter=AM "$BASE"...HEAD -- 'backend/prisma/migrations/**/migration.sql' || true)
          if [ -z "$NUEVAS" ]; then
            echo "El PR no añade ni cambia migraciones."
            exit 0
          fi
          echo "Migraciones en este PR:"
          echo "$NUEVAS" | sed 's/^/  /'

          HALLAZGOS="$RUNNER_TEMP/migraciones-peligrosas.txt"
          : > "$HALLAZGOS"
          PATRON='DROP[[:space:]]+(COLUMN|TABLE)|RENAME[[:space:]]+(COLUMN|TO)|SET[[:space:]]+NOT[[:space:]]+NULL'
          for f in $NUEVAS; do
            grep -niE "$PATRON" "$f" | sed "s|^|  $f:|" >> "$HALLAZGOS" || true
          done

          if [ ! -s "$HALLAZGOS" ]; then
            echo "Ninguna sentencia destructiva."
            exit 0
          fi

          echo "Sentencias que rompen la revisión antigua durante el despliegue:"
          cat "$HALLAZGOS"

          # Dos formas de confirmar que es deliberado y que la fase previa ya
          # está desplegada: la etiqueta del PR, o un commit que lo diga.
          if echo ",$ETIQUETAS," | grep -q ',migracion-contract,'; then
            echo "::notice::Confirmado con la etiqueta 'migracion-contract'."
            exit 0
          fi
          if git log --format=%B "$BASE"..HEAD | grep -qiF 'contract-migration: ok'; then
            echo "::notice::Confirmado con 'contract-migration: ok' en un commit."
            exit 0
          fi

          echo "::error::Esta migración rompe la revisión antigua mientras dura el despliegue (cloudbuild aplica las migraciones antes de cambiar el tráfico). Si el código que usaba esas columnas YA está desplegado, confírmalo con la etiqueta 'migracion-contract' en el PR o con la línea 'contract-migration: ok' en un commit. Si no, pártelo en dos deploys."
          exit 1

      # No bloquea: el riesgo real es bajo y ocasional, pero conviene recordar
      # el orden. Vercel publica el frontend en cuanto se fusiona, mientras que
      # el backend pasa por build, migraciones y despliegue de revisión.
      - name: Aviso si el PR toca frontend y backend a la vez
        run: |
          BASE="origin/${{ github.base_ref }}"
          CAMBIOS=$(git diff --name-only "$BASE"...HEAD)
          TOCA_FRONT=$(echo "$CAMBIOS" | grep -c '^frontend/' || true)
          TOCA_BACK=$(echo "$CAMBIOS" | grep -c '^backend/' || true)
          if [ "$TOCA_FRONT" -gt 0 ] && [ "$TOCA_BACK" -gt 0 ]; then
            echo "::warning::Este PR toca frontend ($TOCA_FRONT ficheros) y backend ($TOCA_BACK). Vercel publica el frontend en cuanto se fusiona y el backend tarda varios minutos: si el frontend depende de algo nuevo del backend, habrá una ventana en la que falle. Si es el caso, fusiona antes el backend."
          else
            echo "El PR no mezcla frontend y backend."
          fi

  frontend:
    name: Frontend — lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      # No hay script `typecheck` en frontend/package.json — `next build`
      # tipa como parte de la compilación (ver AGENTS.md).
      #
      # NEXT_PUBLIC_API_BASE_URL es obligatoria desde 2026-09-17: sin ella el
      # bundle salía apuntando a un rewrite hacia localhost y la aplicación se
      # publicaba muda (pasó dos veces en producción), así que lib/api.ts
      # ahora lanza en build. No es un secreto — es la URL pública del backend
      # — y Vercel ya la tiene configurada en su propio build, que es el que
      # de verdad protege el despliegue.
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.alhabla.ai

  web:
    name: Web — lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      # La web de marketing (PLAN-APP-DOMINIO.md): mismas reglas que el
      # frontend. NEXT_PUBLIC_APP_URL es a dónde enlaza «Entrar» y a dónde
      # salta el registro con el pase.
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.alhabla.ai
          NEXT_PUBLIC_SITE_URL: https://alhabla.ai
          NEXT_PUBLIC_APP_URL: https://app.alhabla.ai
