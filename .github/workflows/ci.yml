name: CI

# Gate de calidad: corre en cada PR y en cada push a main, para backend y
# frontend por separado. No despliega nada — eso lo hace deploy-backend.yml
# (solo backend; el frontend se despliega solo vía la integración Git de
# Vercel). Ver Second-Brain "Runbook de despliegue a producción" y
# "Producción e infraestructura" para el resto del pipeline.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend — typecheck, lint, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test

  integration:
    name: Backend — tests de integración
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Estos tests corren contra Postgres y Redis DE VERDAD (no mocks): es la
    # única capa donde se comprueban el esquema real, las transacciones y la
    # caché de voz. Existían desde hacía tiempo pero no los ejecutaba nadie
    # salvo a mano, así que un fallo de esquema solo aparecía en producción.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alhabla_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # En local estas variables salen de backend/.env.test, que está en
      # .gitignore. `tests/integration/setup.ts` carga ese fichero con dotenv
      # SIN override, así que lo que se ponga aquí manda y en CI da igual que
      # el fichero no exista. El puerto es 5432 y no 5433: el 5433 de local
      # solo evita el choque con el Postgres de Homebrew.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/alhabla_test
      REDIS_URL: redis://localhost:6379/1
      # Valores de relleno, no secretos: estos tests no llaman a ningún
      # servicio externo.
      JWT_SECRET: ci-tests-de-integracion-sin-valor-real
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # El esquema tiene que existir antes de que los tests limpien tablas.
      # `migrate deploy` (no `dev`) para aplicar exactamente las migraciones
      # versionadas, que es lo que corre en producción.
      - run: npx prisma migrate deploy

      - run: npm run test:integration

  frontend:
    name: Frontend — lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      # No hay script `typecheck` en frontend/package.json — `next build`
      # tipa como parte de la compilación (ver AGENTS.md).
      #
      # NEXT_PUBLIC_API_BASE_URL es obligatoria desde 2026-09-17: sin ella el
      # bundle salía apuntando a un rewrite hacia localhost y la aplicación se
      # publicaba muda (pasó dos veces en producción), así que lib/api.ts
      # ahora lanza en build. No es un secreto — es la URL pública del backend
      # — y Vercel ya la tiene configurada en su propio build, que es el que
      # de verdad protege el despliegue.
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.alhabla.ai
