name: Deploy backend

# Solo backend: el frontend se despliega solo vía la integración Git de
# Vercel (Root Directory ya corregido a "frontend", ver Second-Brain
# "Producción e infraestructura" § Vercel) — añadir aquí un deploy de
# frontend competiría con esa vía.
#
# Autenticación sin claves de larga duración: Workload Identity Federation.
# La service account github-actions-ci solo puede ser asumida por workflows
# de este repo exacto (MMARTID/botbook) — ver el binding
# roles/iam.workloadIdentityUser con condición de repositorio. Detalle
# completo del pool/provider y de qué permisos tiene esa SA y por qué, en la
# memoria de Claude Code "ci-cd-pipeline-setup" y en Second-Brain "Runbook de
# despliegue a producción".

on:
  push:
    branches: [main]
    # Solo cuando cambia algo que la imagen o este workflow usan. El
    # environment `production` exige aprobación manual: sin este filtro,
    # cada PR de frontend o de documentación fusionado pedía aprobar un
    # deploy que reconstruía la misma imagen (pasó cuatro veces el 17-09).
    # Vercel despliega el frontend por su cuenta.
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

permissions:
  contents: read
  id-token: write # obligatorio para que google-github-actions/auth pueda pedir el token OIDC

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false # nunca cancelar un deploy a mitad — encolar el siguiente

env:
  GCP_PROJECT_ID: project-84381467-a606-4b71-a6e
  GCP_REGION: europe-west1
  IMAGE: europe-west1-docker.pkg.dev/project-84381467-a606-4b71-a6e/alhabla/backend

jobs:
  test:
    name: Test antes de desplegar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test

  deploy:
    name: Build y deploy a Cloud Run
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      # fetch-depth: 0 para poder comparar el diff real del push y decidir si
      # hay que forzar el reconciliador de agentes (ver el último paso).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: auth
        name: Autenticar contra GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/364278302839/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-ci@project-84381467-a606-4b71-a6e.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Construir y publicar la imagen (cloudbuild.yaml aplica las migraciones de Prisma)
        working-directory: backend
        run: |
          # `gcloud builds submit` (sin --async) intenta hacer streaming del log
          # del build por defecto — ese streaming exige el rol primitivo Viewer/
          # Owner del proyecto (no basta con permisos granulares de Cloud Build o
          # Cloud Logging: se probó roles/logging.viewer y el fallo persistió,
          # exactamente igual con --suppress-logs). github-actions-ci no tiene
          # ese rol a propósito (mínimo privilegio), así que el build terminaba
          # bien en GCP pero el comando `gcloud` salía con exit 1 igualmente.
          # Solución real: --async (solo crea el build y devuelve su ID, sin
          # intentar ningún streaming) + sondear nosotros mismos con
          # `gcloud builds describe`, que solo necesita cloudbuild.builds.get
          # (ya cubierto por cloudbuild.builds.editor) — verificado en local
          # antes de este cambio, tres builds reales de prueba.
          BUILD_ID=$(gcloud builds submit \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --config cloudbuild.yaml \
            --substitutions=_TAG="${{ github.sha }}" \
            --async \
            --format='value(id)' \
            .)
          echo "Build ID: $BUILD_ID"

          while true; do
            STATUS=$(gcloud builds describe "$BUILD_ID" --project="${{ env.GCP_PROJECT_ID }}" --format='value(status)')
            echo "Estado del build: $STATUS"
            case "$STATUS" in
              SUCCESS)
                break
                ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                echo "::error::Build $BUILD_ID terminó en $STATUS — ver https://console.cloud.google.com/cloud-build/builds/$BUILD_ID?project=${{ env.GCP_PROJECT_ID }}"
                exit 1
                ;;
              *)
                sleep 10
                ;;
            esac
          done

      # Se captura ANTES de desplegar en vez de deducirla después como "la
      # penúltima": si el deploy falla sin llegar a crear revisión, la
      # penúltima sería la buena de hace dos deploys y revertiríamos de más.
      - name: Anotar la revisión que está sirviendo ahora
        id: revision_previa
        run: |
          ACTUAL=$(gcloud run services describe alhabla-api \
            --region="${{ env.GCP_REGION }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --format='value(status.traffic[0].revisionName)')
          echo "Sirviendo ahora: $ACTUAL"
          echo "nombre=$ACTUAL" >> "$GITHUB_OUTPUT"

      - name: Desplegar la revisión nueva en alhabla-api
        run: |
          gcloud run deploy alhabla-api \
            --image="${{ env.IMAGE }}:${{ github.sha }}" \
            --region="${{ env.GCP_REGION }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --quiet

      - name: Verificar /health tras el deploy
        id: health
        run: |
          # Tres intentos: la revisión ya está sirviendo cuando `gcloud run
          # deploy` vuelve, pero un arranque en frío puede tardar en responder
          # y no queremos revertir un deploy sano por un segundo de más.
          for intento in 1 2 3; do
            if curl -sf --max-time 20 https://api.alhabla.ai/health | tee /dev/stderr | grep -q '"status":"ok"'; then
              exit 0
            fi
            echo "Intento $intento fallido; reintentando en 10 s..."
            sleep 10
          done
          echo "::error::/health no responde ok tras el deploy"
          exit 1

      # Sin esto, una revisión que no levanta se queda sirviendo el 100% del
      # tráfico con el workflow en rojo y nadie delante: el fallo se ve en
      # GitHub, pero producción sigue rota hasta que alguien entra a mano.
      - name: Revertir a la revisión anterior si /health ha fallado
        if: failure() && steps.health.conclusion == 'failure'
        run: |
          ANTERIOR="${{ steps.revision_previa.outputs.nombre }}"
          if [ -z "$ANTERIOR" ]; then
            echo "::error::No hay revisión anterior a la que volver; hay que intervenir a mano."
            exit 1
          fi
          echo "Devolviendo el 100% del tráfico a $ANTERIOR"
          gcloud run services update-traffic alhabla-api \
            --to-revisions="$ANTERIOR=100" \
            --region="${{ env.GCP_REGION }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --quiet
          echo "::error::Deploy revertido a $ANTERIOR porque /health no respondía ok."

      # Un deploy NO cambia los agentes ya creados: el prompt y las URLs de
      # las tools van horneados dentro de cada assistant del proveedor. Telnyx
      # se repara solo, pero con el reconciliador diario de las 04:00, así que
      # una mejora desplegada por la mañana no llega a los clientes hasta el
      # día siguiente. Si el diff toca el comportamiento del agente, lo
      # forzamos ahora. El respaldo de Retell NO se repara solo y sigue siendo
      # manual (scripts/syncManagedAgentPrompts.ts).
      - name: Propagar cambios de prompt o de tools a los agentes vivos
        if: success()
        run: |
          ANTES="${{ github.event.before }}"
          if [ -z "$ANTES" ] || [ "$ANTES" = "0000000000000000000000000000000000000000" ]; then
            # HEAD~1 es el primer padre: en un merge a main, la punta de
            # main anterior al merge, que es justo lo que queremos comparar.
            CAMBIOS=$(git diff --name-only HEAD~1 HEAD)
          else
            CAMBIOS=$(git diff --name-only "$ANTES" "${{ github.sha }}")
          fi

          if ! echo "$CAMBIOS" | grep -qE '^backend/src/lib/(managedAgentPrompt|telnyxAssistantPayload)\.ts$'; then
            echo "El deploy no toca el prompt ni el payload del assistant: nada que propagar."
            exit 0
          fi

          echo "::warning::Este deploy cambia el comportamiento del agente. Telnyx se fuerza abajo; el respaldo de RETELL sigue con la versión anterior hasta que alguien corra backend/scripts/syncManagedAgentPrompts.ts contra producción."

          # No bloquea el deploy: si falta el permiso o el job no existe, el
          # reconciliador diario acabará haciéndolo igual.
          if gcloud scheduler jobs run telnyx-reconciler \
              --location="${{ env.GCP_REGION }}" \
              --project="${{ env.GCP_PROJECT_ID }}"; then
            echo "Reconciliador de Telnyx lanzado."
          else
            echo "::warning::No se pudo lanzar telnyx-reconciler (¿falta roles/cloudscheduler.jobRunner en github-actions-ci?). Los assistants se reconciliarán en la pasada de las 04:00."
          fi
